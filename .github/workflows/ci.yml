name: Manual validation

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Explicitly run tests (native media coverage requires external dependencies)'
        required: false
        default: false
        type: boolean

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FluxMedia.slnx
      - run: dotnet build FluxMedia.slnx -c Release --no-restore
      - if: ${{ inputs.run_tests }}
        run: dotnet test tests/FluxMedia.Tests/FluxMedia.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --blame-hang --blame-hang-timeout 2m
        env:
          FLUXMEDIA_FFMPEG_ROOT: ${{ github.workspace }}\FFmpeg\win-x64\native
          FLUXMEDIA_HLS_TEST_URL: ${{ secrets.FLUXMEDIA_HLS_TEST_URL }}
          FLUXMEDIA_RTSP_TEST_URL: ${{ secrets.FLUXMEDIA_RTSP_TEST_URL }}
      - run: dotnet pack src/FluxMedia.Playback/FluxMedia.Playback.csproj -c Release --no-build --no-restore -o artifacts/packages
      - run: dotnet pack src/FluxMedia.Avalonia/FluxMedia.Avalonia.csproj -c Release --no-build --no-restore -o artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-and-packages
          path: |
            tests/FluxMedia.Tests/TestResults/**
            artifacts/packages/**

  cross-platform-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FluxMedia.slnx
      - run: dotnet build src/FluxMedia.Playback/FluxMedia.Playback.csproj -c Release --no-restore
      - run: dotnet build src/FluxMedia.Avalonia/FluxMedia.Avalonia.csproj -c Release --no-restore
      - if: ${{ inputs.run_tests }}
        run: dotnet test tests/FluxMedia.Tests/FluxMedia.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~PlatformPlaybackTests"
